services:
  - type: web
    name: andani-jobflow-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: APP_ENV
        value: production
      - key: JOB_SOURCES
        value: greenhouse
      - key: FRONTEND_URL
        value: https://job-flow-frontend.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
