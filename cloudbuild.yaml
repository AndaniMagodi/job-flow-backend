steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/jobflow/backend:$COMMIT_SHA', '-f', 'backend/Dockerfile', 'backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/jobflow/backend:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - jobflow-backend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/jobflow/backend:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --quiet
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/jobflow/backend:$COMMIT_SHA'
