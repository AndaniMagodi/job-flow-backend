# Deploys the backend to Cloud Run in africa-south1 — the region closest to the
# users this job board serves, and the project that holds the Cloud SQL
# instance and the Secret Manager entries.
#
# The Cloud Build trigger must run in (or have deploy permission on) the
# project named by _PROJECT below.
#
# Images are tagged with $BUILD_ID rather than $COMMIT_SHA: COMMIT_SHA is only
# populated for trigger-driven builds, so a manual `gcloud builds submit` would
# otherwise produce an invalid empty tag. Cloud Build records the commit against
# the build either way.

substitutions:
  _PROJECT: project-0d6b5fb6-8096-4245-abb
  _REGION: africa-south1
  _REPO: jobflow-repo
  _SERVICE: jobflow-backend
  _SQL_INSTANCE: project-0d6b5fb6-8096-4245-abb:africa-south1:jobflow-db

steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:$BUILD_ID'
      - -f
      - backend/Dockerfile
      - backend

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:$BUILD_ID'

  # Migrations run as a Cloud Run job rather than on container start, so a
  # scale-out never has two instances migrating at once, and a failed migration
  # stops the pipeline before the new revision serves traffic.
  - id: migrate
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run jobs deploy ${_SERVICE}-migrate \
          --project=${_PROJECT} \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:$BUILD_ID \
          --set-cloudsql-instances=${_SQL_INSTANCE} \
          --set-secrets=DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest \
          --command=alembic --args=upgrade,head \
          --max-retries=0 \
          --quiet
        gcloud run jobs execute ${_SERVICE}-migrate \
          --project=${_PROJECT} \
          --region=${_REGION} \
          --wait \
          --quiet

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--project=${_PROJECT}'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # The Dockerfile listens on 8080; the service was previously on 8000.
      - '--port=8080'
      - '--add-cloudsql-instances=${_SQL_INSTANCE}'
      # Secrets are referenced, never written into this file or the image.
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,ADZUNA_APP_ID=ADZUNA_APP_ID:latest,ADZUNA_APP_KEY=ADZUNA_APP_KEY:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_USERNAME=SMTP_USERNAME:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,SMTP_FROM=SMTP_FROM:latest'
      # ^##^ is gcloud's custom-delimiter syntax. JOB_SOURCES contains a comma,
      # which the default parser would read as the end of the value.
      - '--set-env-vars=^##^APP_ENV=production##JOB_SOURCES=greenhouse,adzuna##GROQ_MODEL=openai/gpt-oss-120b##FRONTEND_URL=https://job-flow-frontend.vercel.app##SMTP_PORT=587##SMTP_USE_TLS=true##SMTP_FROM_NAME=JobFlow'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/${_SERVICE}:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
